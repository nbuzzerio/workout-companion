# Include INSIDE the existing HTTPS server {} for the chosen hostname.
# Do not replace the existing server or its TLS / site configuration.
# Put this include before other regex locations that might match /apps/.
location = /apps { return 404; }
location = /apps/ { return 404; }
location ~ ^/apps/(?<personal_slug>[a-z][a-z0-9]*(?:-[a-z0-9]+)*)/(?<personal_path>.*)$ {
    root /srv/personal-apps;
    autoindex off;
    # Unknown apps are rejected before SPA fallback, including first deployment.
    if (!-f /srv/personal-apps/apps/$personal_slug/index.html) { return 404; }
    if ($personal_slug ~ ".{49}") { return 404; }
    if ($personal_path ~ "(^|/)\.") { return 404; }
    # Revalidate HTML, manifest, service worker and assets on every network load.
    # Avoid old HTML referencing removed assets; retained releases allow rollback.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Owner-created file: repeat the existing host's reviewed security headers.
    # Missing file deliberately makes nginx -t fail rather than drop policy.
    include /etc/nginx/snippets/personal-apps-security-headers.conf;
    try_files $uri @personal_app_fallback;
}
location @personal_app_fallback {
    root /srv/personal-apps;
    # Missing static files must be a 404, never an HTML response.
    if ($uri ~ "\.[^/]+$") { return 404; }
    try_files /apps/$personal_slug/index.html =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    include /etc/nginx/snippets/personal-apps-security-headers.conf;
}
# Invalid slugs / malformed app prefixes cannot fall through to an existing SPA.
location /apps/ { return 404; }
